services:
  bkg-tts:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-bkg-tts}"
      - "traefik.http.routers.bkg-tts.rule=Host(`${BKG_TTS_TRAEFIK_HOST:?set BKG_TTS_TRAEFIK_HOST}`)"
      - "traefik.http.routers.bkg-tts.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.bkg-tts.tls=true"
      - "traefik.http.services.bkg-tts.loadbalancer.server.port=8092"
